nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/josh/ceph-mgr-endpoint-controller
  tag: ""
  pullPolicy: IfNotPresent

secret:
  name: ceph-mgr-endpoint-controller-secret
  userID: userID
  userKey: userKey

config:
  create: true
  name: ceph-config
  clusterID: ""
  monitors: []

controller:
  serviceName: ceph-mgr
  dashboardSliceName: ceph-mgr-dashboard
  prometheusSliceName: ceph-mgr-prometheus
  interval: 30s
  maxConsecutiveFailures: 10
  debug: false

service:
  create: true
  ports:
    dashboard: 8443
    prometheus: 9283

serviceAccount:
  create: true
  name: ""

networkPolicy:
  ingress:
    enabled: false
    rules: []
  egress:
    enabled: false
    dns:
      enabled: true
      to: []
    kubeApiServer:
      enabled: true
      hosts: []
      port: 6443
    monitors:
      enabled: true
      hosts: []
      ports:
        - 3300
        - 6789
    manager:
      enabled: true
      hosts: []
      portRange:
        from: 6800
        to: 7300
    rules: []

resources:
  limits:
    cpu: 50m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi
