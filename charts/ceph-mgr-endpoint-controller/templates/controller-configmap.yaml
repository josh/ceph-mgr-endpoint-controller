{{- $interval := toString .Values.controller.interval }}
{{- if not (regexMatch `^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$` $interval) }}
{{- fail (printf "controller.interval must be a Go duration string such as \"30s\" or \"1m30s\", got %q" $interval) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ceph-mgr-endpoint-controller.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ceph-mgr-endpoint-controller.labels" . | nindent 4 }}
data:
  config.json: {{ dict "debug" .Values.controller.debug "interval" $interval "maxConsecutiveFailures" (int .Values.controller.maxConsecutiveFailures) "namespace" .Release.Namespace "serviceName" .Values.controller.serviceName "dashboardSlice" .Values.controller.dashboardSliceName "prometheusSlice" .Values.controller.prometheusSliceName | toJson | quote }}
