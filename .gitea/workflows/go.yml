name: Go

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.ceph }}, linux/${{ matrix.arch }})
    strategy:
      matrix:
        ceph:
          - umbrella
          - tentacle
          - squid
        arch:
          - amd64
          - arm64
    runs-on: ceph-${{ matrix.ceph }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build

      - name: Print version
        run: |
          ./ceph-mgr-endpoint-controller version
